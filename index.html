<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circuit Studio · Faculty</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:#eef4f8;color:#173044}
main{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{width:min(100%,440px);padding:38px;background:white;border:1px solid #dbe5ec;border-radius:20px;box-shadow:0 18px 60px #17304412}
.mark{width:48px;height:48px;display:grid;place-items:center;background:#dff5ed;border-radius:14px;color:#137c62;font-size:26px;font-weight:700}
h1{font-size:28px;line-height:1.2;margin:24px 0 10px}p{color:#526979;margin:0 0 25px}
label{display:block;font-weight:600;margin-bottom:8px}input,button{font:inherit;width:100%;padding:12px 14px;border-radius:10px}input{border:1px solid #a8bbc8}input:focus{outline:3px solid #86d7c3;outline-offset:2px}button{border:0;background:#12745e;color:white;font-weight:650;cursor:pointer;margin-top:18px}button:hover{background:#0c5e4c}
#error{color:#ad2929;min-height:24px;margin:12px 0 0;font-size:14px}
iframe{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:white}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="gate"><section class="card" aria-labelledby="title">
<div class="mark" aria-hidden="true">⌁</div>
<h1 id="title">Circuit Studio</h1>
<p>Faculty demonstration workspace</p>
<form id="login">
<label for="password">Password</label>
<input type="password" id="password" autocomplete="current-password" required autofocus aria-describedby="error">
<button type="submit">Open Circuit Studio</button>
<p id="error" role="alert"></p>
</form></section></main>
<script>
'use strict';
// Convenience gate only. Public hosting does not protect the underlying HTML.
const sessionKey='circuit-studio-faculty-access-v1';
function openStudio(){
 document.getElementById('gate').hidden=true;
 const frame=document.createElement('iframe');
 frame.title='Circuit Studio faculty demonstration';
 frame.src='Circuit_Studio_Faculty_Demo.html';
 frame.allow='microphone; camera; display-capture; fullscreen; autoplay';
 frame.allowFullscreen=true;
 document.body.append(frame);
}
document.getElementById('login').addEventListener('submit',event=>{
 event.preventDefault();
 if(document.getElementById('password').value==='Faculty'){
  try{sessionStorage.setItem(sessionKey,'granted')}catch{}
  document.getElementById('password').value='';
  openStudio();
 }else{
  document.getElementById('error').textContent='Incorrect password. Please try again.';
  document.getElementById('password').select();
 }
});
try{if(sessionStorage.getItem(sessionKey)==='granted')openStudio()}catch{}
</script>
</body>
</html>
